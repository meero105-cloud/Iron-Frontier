name: Android APK · AAB

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 웹 파일 준비
        run: bash scripts/build-www.sh

      - name: Capacitor Android 프로젝트 생성
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: 앱 아이콘·시작 화면 (assets/의 원본 그림에서 모든 해상도 생성)
        run: |
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#232819' --splashBackgroundColor '#12160f' --splashBackgroundColorDark '#12160f'
          ls android/app/src/main/res/mipmap-xxxhdpi

      - name: 버전 번호 (빌드마다 1씩 증가)
        working-directory: android/app
        run: |
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle

      - name: 서명 설정 (Secrets에 키가 있을 때)
        if: env.HAS_KEY == 'true'
        working-directory: android/app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > upload.p12
          cat >> build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("upload.p12")
                      storeType "pkcs12"
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KS_KEY_PASS")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE

      - name: 테스트용 APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 출시용 APK · AAB (release, 서명)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: 결과 파일 모으기
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/iron-frontier-debug.apk
          if [ "$HAS_KEY" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/iron-frontier.apk
            cp android/app/build/outputs/bundle/release/app-release.aab dist/iron-frontier.aab
          else
            echo "::warning::서명 키 Secrets가 없어 debug APK만 만들었습니다. output/iron-frontier-signing/README.txt 참고"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: iron-frontier-android
          path: dist/

      - name: 태그(v*)면 GitHub Release에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
