name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 웹 파일 준비
        run: bash scripts/build-www.sh

      - name: Capacitor Android 프로젝트 생성
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: APK 빌드 (테스트용 debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iron-frontier-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
