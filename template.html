<title>철의 경계선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a war-room console. Full-height map table on the left, a dispatch column on the right; stacks on phones. */
:root {
  --ocean: #0d1a1f;
  --ocean-grid: #13262d;
  --panel: #121f24;
  --panel-2: #182a30;
  --line: #24393f;
  --ink: #dfe6e2;
  --ink-dim: #8aa0a0;
  --land: #3a4649;
  --wild: #3c4636;
  --fog: #24383e;
  --ocean-deep: #10232a;
  --land-edge: #0b1418;
  --signal: #f0c349;   /* player / call to action */
  --danger: #e2574c;
  --ok: #6cc28a;
  --font-display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ocean); color: var(--ink); font-family: var(--font-body);
  overflow: hidden;
}
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
.brand small { font-family: var(--font-data); font-size: 11px; color: var(--ink-dim); letter-spacing: .12em; margin-left: 8px; text-transform: uppercase; }
.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat b { font-family: var(--font-data); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10.5px; color: var(--ink-dim); letter-spacing: .08em; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-dim); white-space: nowrap; }
.chip.live { color: var(--ocean); background: var(--signal); border-color: var(--signal); font-weight: 700; }
.spacer { flex: 1; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer;
}
button:hover { border-color: var(--ink-dim); }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
button.primary { background: var(--signal); color: #1a1405; border-color: var(--signal); font-weight: 700; }
button.primary:hover { filter: brightness(1.08); }
button[disabled] { opacity: .4; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 7px 10px; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--signal); }

.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.mapwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background:
    repeating-linear-gradient(0deg, transparent 0 39px, var(--ocean-grid) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, var(--ocean-grid) 39px 40px),
    var(--ocean);
}
svg#map { width: 100%; height: 100%; display: block; touch-action: none; }
.terr { stroke: var(--land-edge); stroke-width: .5; cursor: pointer; transition: fill .35s; }
.terr:hover { filter: brightness(1.25); }
.terr.sel { stroke: var(--signal); stroke-width: 1.6; }
.terr.tgt-enemy { stroke: var(--danger); stroke-width: 1.1; stroke-dasharray: 3 2; }
.terr.tgt-own { stroke: var(--ok); stroke-width: 1.1; stroke-dasharray: 3 2; }
.globe { fill: var(--ocean-deep); stroke: #2c4a52; stroke-width: 1; }
.terr.fog { stroke: none; cursor: default; }
.terr.fog:hover { filter: none; }
.terr.stale { opacity: .55; }
.lbl .l2, .lbl .l3 { font-family: var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--ocean); stroke-width: 2.4px; font-weight: 500; }
.lbl .l3 { fill: var(--signal); }
.lbl .n { font-size: 8.5px; }
.pop { position: absolute; z-index: 6; background: var(--panel); border: 1px solid var(--signal); border-radius: 5px; padding: 8px 10px; width: 220px; max-width: calc(100% - 16px);
  box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
.pop h4 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pop .row { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-dim); }
.pop .row b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }
.pop .x { border: 0; background: transparent; padding: 0 4px; font-size: 16px; line-height: 1; color: var(--ink-dim); }
.popb { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.popb button, .pop .primary { font-size: 11.5px; padding: 5px 6px; }
.sea { fill: none; stroke: #4d6a70; stroke-width: .5; stroke-dasharray: 2 3; opacity: .55; pointer-events: none; }
.sea.hot { stroke: var(--signal); opacity: 1; stroke-width: .9; }
.lbl circle { stroke: var(--land-edge); }
.lbl text { font-family: var(--font-data); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lbl { pointer-events: none; }
.arrow { fill: none; stroke-linecap: round; pointer-events: none; }

.tip {
  position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  padding: 8px 10px; border-radius: 4px; font-size: 12px; min-width: 150px; max-width: 240px; z-index: 5;
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
}
.tip h4 { margin: 0 0 4px; font-size: 13px; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-dim); }
.tip .row b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }
.tip .odds { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }

.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; font-size: 11px; color: var(--ink-dim);
  background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 6px 9px; border-radius: 4px; border: 1px solid var(--line); line-height: 1.6; }
.legend i { display: inline-block; width: 16px; border-top: 1px dashed #4d6a70; vertical-align: middle; margin-right: 6px; }

.side { min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding-block: 14px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.side h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; color: var(--ink-dim); font-weight: 500; text-transform: uppercase; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 12px; }
.card .name { font-family: var(--font-display); font-size: 20px; text-wrap: balance; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin-top: 8px; font-size: 12.5px; }
.kv span { color: var(--ink-dim); }
.kv b { font-family: var(--font-data); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.hint { font-size: 12.5px; color: var(--ink-dim); line-height: 1.55; margin-top: 8px; }
.hint strong { color: var(--signal); font-weight: 500; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.rank { display: flex; flex-direction: column; gap: 6px; }
.rank .r { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; font-size: 12.5px; }
.rank .r.dead { opacity: .35; text-decoration: line-through; }
.rank .bar2 { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.rank .bar2 div { height: 100%; }
.rank .pct { font-family: var(--font-data); text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12px; line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }
.log li { color: var(--ink-dim); border-left: 2px solid var(--line); padding-left: 8px; }
.log li.me { border-left-color: var(--signal); color: var(--ink); }
.log li.bad { border-left-color: var(--danger); color: var(--ink); }
.log li .t { font-family: var(--font-data); font-size: 10.5px; color: var(--ink-dim); margin-right: 6px; }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,12,14,.72); z-index: 10; padding: 16px; }
.overlay .box { max-height: 100%; overflow-y: auto; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px; text-align: left; }
.overlay h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0 0 6px; }
.overlay p { color: var(--ink-dim); line-height: 1.6; margin: 0 0 14px; font-size: 13.5px; }
.resbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.resbar .rs { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 6px; }
.resbar span { font-size: 11px; color: var(--ink-dim); grid-column: 1 / -1; }
.resbar b { font-family: var(--font-data); font-size: 16px; font-variant-numeric: tabular-nums; }
.resbar i { font-style: normal; font-family: var(--font-data); font-size: 11px; color: var(--ok); }
.resbar i.neg { color: var(--danger); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 7px 9px; color: var(--ink-dim); font-size: 12.5px; }
.tabs button[aria-selected="true"] { color: var(--signal); border-bottom-color: var(--signal); }
.sub { margin: 14px 0 6px; font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); font-weight: 500; }
.blds { display: flex; flex-direction: column; gap: 6px; }
.bld { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.bld span { font-size: 12.5px; min-width: 0; }
.bld i { font-style: normal; font-family: var(--font-data); color: var(--ink-dim); font-size: 11px; }
.bld small { display: block; color: var(--ink-dim); font-size: 11px; }
.bld button, .btnrow button, .dip button { font-size: 11.5px; padding: 5px 8px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.dips { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.dip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-size: 12.5px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.dip .btnrow { grid-column: 1 / -1; margin-top: 0; }
.offer { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; padding: 8px; border: 1px solid var(--signal); border-radius: 4px; margin-bottom: 6px; }
.wpns { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-dim); }
.wpns span { padding: 2px 7px; border: 1px solid var(--line); border-radius: 3px; }
.wpns span.on { color: var(--ink); border-color: var(--signal); }
.wpns i { font-style: normal; }
.pill { font-style: normal; font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line); }
.pill.war { color: var(--danger); border-color: var(--danger); }
.pill.calm { color: var(--ink); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.scenh { margin: 14px 0 8px; font-size: 11px; letter-spacing: .14em; color: var(--ink-dim); font-weight: 500; }
.ancient .terr { stroke-opacity: .22; }
.modeseg { width: 100%; flex-wrap: wrap; }
.modehint { margin: 8px 0 0 !important; font-size: 12.5px !important; }
.joinrow { display: flex; gap: 8px; margin-top: 8px; }
.joinrow input, .nickrow input { flex: 1; min-width: 0; font: inherit; font-family: var(--font-data); color: var(--ink); background: var(--ocean); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; }
.nickrow { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-dim); }
.code { font-family: var(--font-data); font-size: 22px; letter-spacing: .12em; color: var(--signal); }
.seat.mine { border-color: var(--signal); }
.lobbybtns { display: flex; gap: 8px; margin-top: 14px; }
.modeseg button { flex: 1; padding: 9px 10px; }
.scen { display: flex; flex-direction: column; gap: 8px; }
.scenbtn { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: left; padding: 12px 14px; }
.scenbtn b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.scenbtn em { font-style: normal; font-size: 11.5px; color: var(--signal); align-self: center; }
.scenbtn span { grid-column: 1 / -1; color: var(--ink-dim); font-size: 12.5px; line-height: 1.5; }
.scenbtn:hover { border-color: var(--signal); }
.toast { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
  padding: 8px 14px; border-radius: 4px; font-size: 13px; z-index: 6; transition: opacity .3s; max-width: calc(100% - 32px); text-align: center; }
.toast.win { border-color: var(--ok); }
.toast.lose { border-color: var(--danger); }
.pickbanner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 4; background: var(--signal); color: #1a1405; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  padding: 8px 16px; border-radius: 4px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }

@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: 1fr; }
  .mapwrap { height: 62vh; }
  .side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .brand small { display: none; }
  .pickbanner { white-space: normal; text-align: center; width: max-content; max-width: calc(100% - 32px); }
}
@media (prefers-reduced-motion: reduce) { .terr { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">철의 경계선<small>World Front · Prototype</small></div>
    <div class="stat"><b id="date">—</b><span>작전 시기</span></div>
    <div class="stat"><b id="turn">0</b><span id="turnLbl">턴</span></div>
    <span class="chip" id="phase">국가 선택</span>
    <div class="stat" id="poolStat" hidden><b id="pool">0</b><span>배치 가능 병력</span></div>
    <div class="spacer"></div>
    <div class="controls">
      <div class="seg" id="stepSeg" hidden aria-label="배치 단위">
        <button type="button" id="step1" data-step="1" aria-pressed="true">+1</button>
        <button type="button" id="step5" data-step="5" aria-pressed="false">+5</button>
        <button type="button" id="stepAll" data-step="999" aria-pressed="false">전부</button>
      </div>
      <button type="button" id="autoBtn" hidden>자동 배치</button>
      <div class="seg" id="speedSeg" hidden aria-label="실시간 속도">
        <button type="button" id="spX2" data-speed="x2" aria-pressed="false">하루 0.5초</button>
        <button type="button" id="spDay" data-speed="day" aria-pressed="true">하루 1초</button>
        <button type="button" id="spSlow" data-speed="slow" aria-pressed="false">하루 2초</button>
      </div>
      <button type="button" id="pauseBtn" hidden>❚❚ 일시정지</button>
      <button type="button" id="endBtn" class="primary" hidden>턴 종료</button>
      <button type="button" id="rulesBtn">게임 방법</button>
      <button type="button" id="newBtn">새 게임</button>
    </div>
  </header>
  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" viewBox="0 0 960 470" preserveAspectRatio="xMidYMid meet" role="img" aria-label="세계 전황 지도"></svg>
      <div class="pickbanner" id="pickBanner"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="pop" id="pop" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <div class="legend"><i></i>해상 항로 · 끌어서 지구본 회전 · 휠/핀치로 확대 (가까이 보면 자원과 시설이 보입니다)</div>
      <div class="overlay" id="overlay" hidden><div class="box" id="overlayBox"></div></div>
    </div>
    <aside class="side">
      <div class="resbar" id="resbar"></div>
      <div class="tabs" role="tablist" aria-label="정보 탭">
        <button type="button" role="tab" id="tab-region" data-tab="region" aria-selected="true">지역</button>
        <button type="button" role="tab" id="tab-nation" data-tab="nation" aria-selected="false">내정·군대</button>
        <button type="button" role="tab" id="tab-dip" data-tab="dip" aria-selected="false">외교·무역</button>
        <button type="button" role="tab" id="tab-world" data-tab="world" aria-selected="false">판도</button>
      </div>
      <section data-pane="region"><div class="card" id="selCard"></div></section>
      <section data-pane="nation" hidden><div class="card" id="meCard"></div></section>
      <section data-pane="dip" hidden><div class="card" id="dipCard"></div></section>
      <section data-pane="world" hidden><h3>세력 판도 · 영토 가치</h3><div class="rank" id="rank"></div></section>
      <section><h3>전황 기록</h3><ul class="log" id="log"></ul></section>
    </aside>
  </div>
</div>

(() => {

    S.factions.forEach(f => { if (f.alive && !owned(f.id).length) f.alive = false; });
    const alive = S.factions.filter(f => f.alive);
    const top = S.factions.find(f => share(f.id) >= 0.5) || (alive.length === 1 ? alive[0] : null);
    if (top) { S.over = { w: top.id }; S.phase = "over"; stopClock(); showNetEnd(); }
    return;
  }
  const me = fac(S.player);
  if (!owned(S.player).length) { me.alive = false; S.over = "lose"; S.phase = "over"; showEnd(false, "모든 영토를 잃었습니다."); return; }
  if (share(S.player) >= 0.5) { S.over = "win"; S.phase = "over"; showEnd(true, "세계 영토 가치의 절반을 장악했습니다."); return; }
  const alivePowers = S.factions.filter(f => f.alive && !f.isPlayer);
  if (!alivePowers.length) { S.over = "win"; S.phase = "over"; showEnd(true, "모든 경쟁 열강이 무너졌습니다."); return; }
  const top = alivePowers.find(f => share(f.id) >= dif().aiWin);
  if (top) { S.over = "lose"; S.phase = "over"; showEnd(false, `${top.name} 세력이 세계의 ${Math.round(dif().aiWin * 100)}%를 장악했습니다.`); }
}

// ---------- interaction ----------
function onClick(i) {
  if (!S || S.phase === "over") return;
  if (ui.tab && ui.tab !== "region") setTab("region");
  ui.prev = ui.sel;
  if (S.net === "guest") { guestClick(i); return; }
  if (S.phase === "scenario") return;
  if (S.phase === "pick") { ui.sel = i; render(); return; }
  if (S.phase === "deploy" && isPlayer(i) && S.pool > 0) {
    const n = Math.min(S.pool, ui.step); S.troops[i] += n; S.pool -= n; ui.sel = i;
    if (S.pool === 0) { S.phase = "ops"; toast("배치 완료. 이제 공격하거나 병력을 이동하세요."); }
    render(); persist(); return;
  }
  const s = ui.sel;
  if (s >= 0 && isPlayer(s) && s !== i && NB(s).has(i) && canLaunch(s) && !isPlayer(i) && !canAttack(s, i)) {
    toast(`${fac(owner(i)).name}와(과)는 ${fl().peace} 관계입니다. 외교 탭에서 ${fl().war}해야 공격할 수 있습니다.`, "lose"); return;
  }
  if (s >= 0 && isPlayer(s) && s !== i && NB(s).has(i) && canLaunch(s)) {
    if (S.phase === "deploy") S.phase = "ops";
    if (isPlayer(i)) { const n = S.troops[s] - 1; move(s, i); addLog(`${tn(s)} → ${tn(i)} 병력 ${n} 이동`, "me"); ui.sel = i; }
    else { const r = attack(s, i); toast(r.win ? `${tn(i)} 점령!` : `${tn(i)} 공격 실패`, r.win ? "win" : "lose"); ui.sel = r.win ? i : s; checkEnd(); }
    render(); persist(); broadcast(); return;
  }
  ui.sel = ui.sel === i ? -1 : i;
  render();
}
function guestClick(i) {
  if (S.phase !== "ops") return;
  const s = ui.sel;
  if (s >= 0 && isPlayer(s) && s !== i && NB(s).has(i) && canLaunch(s) && !isPlayer(i) && !canAttack(s, i)) {
    toast(`${fl().peace} 관계인 상대입니다. 외교 탭에서 ${fl().war}하세요.`, "lose"); return;
  }
  if (s >= 0 && isPlayer(s) && s !== i && NB(s).has(i) && canLaunch(s)) {
    const k = isPlayer(i) ? "mv" : "atk";
    NET.room?.emit("act", { k, s, t: i }).catch(() => {});
    toast(k === "mv" ? `${tn(i)}(으)로 이동 명령` : `${tn(i)} 공격 명령 전송`);
    ui.sel = k === "mv" ? i : s;
  } else ui.sel = ui.sel === i ? -1 : i;
  if (ui.sel >= 0 && isPlayer(ui.sel)) NET.room?.emit("act", { k: "focus", s: ui.sel }).catch(() => {});
  render();
}

svg.call(zoom).on("dblclick.zoom", null);

let liveArrows = [];

function guideText() {

}

function drawArrows() {
  const now = arrows.splice(0).filter(a => seenT(a.src) || seenT(a.tgt));
  if (!now.length) return;
  liveArrows = liveArrows.concat(now).slice(-60);
  setTimeout(() => { liveArrows = liveArrows.filter(a => !now.includes(a)); redraw(); }, 1600);
}

function placePop() {

  if (!facing(ui.sel)) { el.style.visibility = "hidden"; return; }

  const sc = Math.min(svgR.width / W, svgR.height / H), ox = (svgR.width - W * sc) / 2, oy = (svgR.height - H * sc) / 2;
  const [px, py] = gproj(T[ui.sel].geoC);
  let x = svgR.left - wr.left + ox + px * sc + 16, y = svgR.top - wr.top + oy + py * sc - 20;
  const w = el.offsetWidth, h = el.offsetHeight;
  if (x + w > wr.width - 8) x = x - w - 32;
  x = Math.max(8, x); y = Math.max(52, Math.min(y, wr.height - h - 8));

}

// The host's page runs the whole simulation; guests send orders and draw the host's state.
const NET = { room: null, role: null, code: "", sc: null, seats: {}, focus: {}, peers: [], myPeer: null, hostPeer: null, endShown: false };
let roomApi = null;
(window.claude && window.claude.use ? window.claude.use("room") : Promise.resolve(null)).then(r => {

function nick() {
  let n = ""; try { n = localStorage.getItem("iron-frontier-nick") || ""; } catch (_) {}
  return n || `지휘관${Math.floor(10 + Math.random() * 90)}`;
}
async function enterRoom(code, role, sc) {
  NET.role = role; NET.code = code; NET.sc = sc || null; NET.seats = {}; NET.focus = {}; NET.endShown = false; NET.nick = nick();
  let room;
  try { room = await roomApi.join("wf-" + code); } catch (e) { toast("방에 들어갈 수 없습니다. 코드를 확인하세요.", "lose"); return; }
  NET.room = room;
  room.onPeers(ch => { NET.peers = ch.peers; onPeersChange(ch); });
  room.on("state", m => { if (NET.role === "guest" && !m.sameTab && (!NET.hostPeer || m.peer === NET.hostPeer)) applyState(m.data); });
  room.on("act", m => { if (NET.role === "host" && !m.sameTab) hostAct(m); });
  room.on("econ", m => { if (NET.role === "guest" && !m.sameTab && (!NET.hostPeer || m.peer === NET.hostPeer)) applyEcon(m.data); });
  room.presence({ nick: NET.nick, want: null, role, sc: NET.sc, seats: {}, phase: "lobby" }).catch(() => {});
  S.phase = "lobby"; S.net = null; S.mode = "rt";
  showLobby(); render();
}
function netLeave() {
  if (NET.room) NET.room.leave().catch(() => {});
  NET.room = null; NET.role = null; NET.hostPeer = null;
}
function onPeersChange(ch) {
  const me = NET.peers.find(p => p.sameTab); if (me) NET.myPeer = me.peer;
  if (NET.role === "host") {
    if (S.phase === "lobby") {
      const present = new Set(NET.peers.map(p => p.peer)), seats = {};
      for (const [peer, k] of Object.entries(NET.seats)) if (present.has(peer)) seats[peer] = k;
      const n = factionsFor(NET.sc).length;
      for (const p of NET.peers) {
        const w = p.presence && p.presence.want;
        if (w === null || w === undefined) { delete seats[p.peer]; continue; }
        if (!Number.isInteger(w) || w < 0 || w >= n) continue;
        if (!Object.entries(seats).some(([q, k]) => k === w && q !== p.peer)) seats[p.peer] = w;
      }
      if (JSON.stringify(seats) !== JSON.stringify(NET.seats)) { NET.seats = seats; NET.room.presence({ seats }).catch(() => {}); }
      showLobby();
    }
  } else {
    const host = NET.peers.find(p => p.presence && p.presence.role === "host");
    if (host) { NET.hostPeer = host.peer; NET.sc = host.presence.sc; NET.seats = host.presence.seats || {}; }
    if (S.phase === "lobby") showLobby();
    else if (S.net === "guest" && ch.left.some(p => p.peer === NET.hostPeer) && S.phase !== "over") {
      S.phase = "over"; render();
      const box = document.getElementById("overlayBox");
      box.innerHTML = `<h2>연결 종료</h2><p>방장이 나가서 게임이 끝났습니다.</p><button type="button" class="primary" id="againBtn">처음으로</button>`;
      document.getElementById("overlay").hidden = false; document.getElementById("againBtn").onclick = newGame;
    }
  }
}

  if (!box.querySelector("#lobbyDyn")) {
    box.innerHTML = `<h2>네트워크 대전</h2>
      <p>방 코드 <b class="code">${NET.code}</b><br>함께할 사람에게 이 코드를 알려 주세요. 이 페이지를 공유받은 사람만 들어올 수 있습니다.</p>
      <label class="nickrow">내 이름 <input id="netNick" maxlength="12" autocomplete="off"></label>
      <div id="lobbyDyn"></div>
      <div class="lobbybtns"><button type="button" id="netStartBtn" class="primary" hidden>전쟁 시작</button><button type="button" id="netLeaveBtn">나가기</button></div>`;
    const ni = document.getElementById("netNick"); ni.value = NET.nick;
    ni.oninput = () => { NET.nick = ni.value.trim().slice(0, 12) || "지휘관"; try { localStorage.setItem("iron-frontier-nick", NET.nick); } catch (_) {} NET.room?.presence({ nick: NET.nick }).catch(() => {}); };
    document.getElementById("netLeaveBtn").onclick = newGame;
    document.getElementById("netStartBtn").onclick = netStart;
    document.getElementById("overlay").hidden = false;
  }
  const dyn = document.getElementById("lobbyDyn");
  if (!NET.sc) { dyn.innerHTML = `<p>방장을 찾는 중입니다. 코드가 맞는지 확인하세요.</p>`; return; }
  const sc = [...ERAS, ...SCENARIOS].find(x => x.id === NET.sc);
  const byPeer = new Map(NET.peers.map(p => [p.peer, p]));
  const seatOf = k => Object.entries(NET.seats).find(([, v]) => v === k);
  const name = p => esc(String((p && p.presence && p.presence.nick) || "참가자").slice(0, 12));
  dyn.innerHTML = `<h3 class="scenh">시나리오 · ${sc ? sc.name : ""}</h3>
    <div class="scen">${factionsFor(NET.sc).map((f, k) => {
      const seat = seatOf(k), mine = seat && seat[0] === NET.myPeer;
      return `<button type="button" class="scenbtn seat${mine ? " mine" : ""}" data-k="${k}"><b><span class="swatch" style="background:${f.color}"></span>${f.name}</b><em>${seat ? (mine ? "나" : name(byPeer.get(seat[0]))) : "컴퓨터"}</em></button>`;
    }).join("")}</div>
    <h3 class="scenh">접속 중 ${NET.peers.length}명</h3>
    <p>${NET.peers.map(p => `${name(p)}${p.presence && p.presence.role === "host" ? " (방장)" : ""}${p.sameTab ? " · 나" : ""}`).join(", ")}</p>
    <p>${NET.role === "host" ? "세력을 하나 고른 뒤 전쟁 시작을 누르세요. 비어 있는 세력은 컴퓨터가 맡습니다." : "세력을 고르고 방장이 시작하기를 기다리세요."}</p>`;
  dyn.querySelectorAll(".seat").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, mine = NET.seats[NET.myPeer] === k;
    NET.room?.presence({ want: mine ? null : k }).catch(() => {});
  });
  const sb = document.getElementById("netStartBtn");
  sb.hidden = NET.role !== "host";
  sb.disabled = NET.seats[NET.myPeer] === undefined;
}
const esc = t => t.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function netStart() {
  setupScenario(NET.sc);
  S.mode = "rt"; S.net = "host"; S.speed = "day"; S.paused = false; S.over = null;
  const humans = new Set(Object.values(NET.seats));
  S.player = NET.seats[NET.myPeer];
  S.factions.forEach(f => { f.isPlayer = f.id === S.player; f.human = humans.has(f.id); });
  begin();
  addLog(`네트워크 대전 시작 · 사람 ${humans.size}명, 컴퓨터 ${S.factions.length - humans.size}세력`, "me");
  hideOverlay(); ui.sel = -1;
  NET.room.presence({ phase: "game" }).catch(() => {});
  render(); broadcast(true);
}
let bcastT = 0;
function broadcast(now) {
  if (S.net !== "host" || !NET.room) return;
  const send = () => { bcastT = 0; if (!NET.room) return; NET.room.emit("state", packState()).catch(() => {}); NET.room.emit("econ", packEcon()).catch(() => {}); };
  if (now) { clearTimeout(bcastT); send(); } else if (!bcastT) bcastT = setTimeout(send, 120);
}
function packState() {
  return { sc: S.scenario, t: S.turn, o: S.owners, r: S.troops, a: S.acted.map(x => x ? 1 : 0).join(""),
    al: S.factions.map(f => f.alive ? 1 : 0).join(""), seats: NET.seats, p: S.paused ? 1 : 0, sp: S.speed,
    ov: S.over ? S.over.w : -1, lg: S.log.slice(-4).map(l => ({ i: l.i, t: l.t, m: l.m })) };
}
function packEcon() {
  return { b: S.bld.map(x => x.join("")).join(""), rs: S.res.map(x => [x.f, x.m, x.g]), pc: S.peace, tr: S.trade, rp: S.rep, wp: S.wpn, tc: S.tech, of: S.offers.slice(-12) };
}
function applyEcon(d) {
  if (S.net !== "guest" || !d || typeof d.b !== "string" || d.b.length !== N * 4 || !Array.isArray(d.rs) || d.rs.length !== S.factions.length) return;
  S.bld = T.map((_, i) => [0, 1, 2, 3].map(k => Math.min(3, +d.b[i * 4 + k] || 0)));
  S.res = d.rs.map(x => ({ f: x[0] | 0, m: x[1] | 0, g: x[2] | 0 }));
  const okKeys = o => Object.fromEntries(Object.entries(o && typeof o === "object" ? o : {}).filter(([k]) => /^\d+-\d+$/.test(k)));
  S.peace = okKeys(d.pc); S.trade = okKeys(d.tr);
  S.rep = Array.isArray(d.rp) ? d.rp.map(x => Math.max(0, Math.min(100, x | 0))) : S.rep;
  S.wpn = Array.isArray(d.wp) && d.wp.length === S.factions.length ? d.wp.map(x => Math.max(0, Math.min(3, x | 0))) : S.wpn;
  S.tech = Array.isArray(d.tc) && d.tc.length === S.factions.length ? d.tc.map(x => Math.max(0, Math.min(3, x | 0))) : S.tech;
  S.offers = (Array.isArray(d.of) ? d.of : []).filter(o => o && Number.isInteger(o.id) && fac(o.from) && fac(o.to) && ["peace", "trade", "merge", "surr"].includes(o.type));
  render();
}
function applyState(d) {
  if (!d || !Array.isArray(d.o) || d.o.length !== N || !Array.isArray(d.r) || d.r.length !== N) return;
  if (S.net !== "guest" || S.scenario !== d.sc) {
    setupScenario(d.sc); initEcon(); S.net = "guest"; S.mode = "rt"; S.log = []; S.logN = 0; NET.endShown = false;
    hideOverlay(); addLog("방장의 전쟁에 합류했습니다.", "me");
    setTimeout(() => { if (S.player >= 0) turnTo(fac(S.player).home); }, 0);
  }
  S.owners = d.o.map(x => Number.isInteger(x) && x >= -1 && x < S.factions.length ? x : -1);
  S.troops = d.r.map(x => Math.max(0, Math.min(99999, x | 0)));
  S.acted = Array.from({ length: N }, (_, i) => d.a && d.a[i] === "1");
  S.turn = d.t | 0; S.paused = !!d.p; S.speed = d.sp;
  NET.seats = d.seats && typeof d.seats === "object" ? d.seats : {};
  const humans = new Set(Object.values(NET.seats));
  const mine = NET.seats[NET.myPeer];
  S.player = Number.isInteger(mine) ? mine : -1;
  S.factions.forEach((f, k) => { f.alive = !d.al || d.al[k] !== "0"; f.isPlayer = k === S.player; f.human = humans.has(k); });
  const seen = new Set(S.log.map(l => l.i));
  for (const l of (Array.isArray(d.lg) ? d.lg : [])) if (Number.isInteger(l.i) && !seen.has(-l.i)) { if (!S.log.some(x => x.i === -l.i)) S.log.push({ i: -l.i, t: l.t | 0, m: esc(String(l.m).slice(0, 200)), k: "" }); }
  if (S.log.length > 120) S.log.splice(0, S.log.length - 120);
  if (d.ov >= 0) { S.over = { w: d.ov }; S.phase = "over"; showNetEnd(); } else S.phase = "ops";
  if (ui.sel >= N) ui.sel = -1;
  render();
}
function hostAct(m) {
  const fid = NET.seats[m.peer], d = m.data || {};
  if (!Number.isInteger(fid) || S.phase !== "ops" || S.paused) return;
  if (["build", "rec", "mkt", "dip", "ans", "wpn", "exp"].includes(d.k)) {
    doAction(fid, { k: d.k, s: d.s, b: d.b, n: d.n, op: d.op, to: d.to, id: d.id, yes: !!d.yes, at: NET.focus[fid] });
    render(); broadcast(); return;
  }
  const s = d.s, t = d.t;
  if (!Number.isInteger(s) || s < 0 || s >= N || owner(s) !== fid) return;
  if (d.k === "focus") { NET.focus[fid] = s; return; }
  if (!Number.isInteger(t) || t < 0 || t >= N || !NB(s).has(t) || !canLaunch(s)) return;
  if (d.k === "mv" && owner(t) === fid) { addLog(`${fac(fid).name}: ${tn(s)} → ${tn(t)} 병력 ${S.troops[s] - 1} 이동`); move(s, t); }
  else if (d.k === "atk" && owner(t) !== fid && canAttack(s, t)) { attack(s, t); checkEnd(); }
  else return;
  render(); broadcast();
}
function showNetEnd() {
  if (NET.endShown || !S.over) return;
  NET.endShown = true;
  const w = fac(S.over.w), win = S.over.w === S.player;
  const box = document.getElementById("overlayBox");
  box.innerHTML = `<h2>${win ? "승전" : "전쟁 종결"}</h2><p>${w.name}${w.human ? "" : " (컴퓨터)"} 세력이 세계를 제패했습니다.<br>${dateLabel(S.turn)}, 개전 ${S.turn}일째.</p><button type="button" class="primary" id="againBtn">처음으로</button>`;
  document.getElementById("overlay").hidden = false;
  document.getElementById("againBtn").onclick = newGame;
}

// ---------- persistence ----------
const KEY = "iron-frontier-v1";
function persist() { if (S && S.net) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} }
function restore(data) {
  let saved = data && data.S;
  if (!saved) { try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) { saved = null; } }
  if (saved && (saved.net || saved.v !== 3)) saved = null;
  if (saved && saved.owners && saved.owners.length === N) { S = saved; render(); if (S.phase === "scenario") showScenarios(); startClock(); if (S.over) showEnd(S.over === "win", "지난 전쟁은 이미 끝났습니다."); }
  else newGame();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
const boot = data => restore(data);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
