<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>철의 경계선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Black+Ops+One&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a field headquarters. The globe sits on a dark map table on the left; dossiers, orders and the
   teletype log fill the right column; stacks on phones. Paper (dossier) surfaces re-scope the ink tokens. */
:root {
  --ocean: #12160f;
  --ocean-grid: #1b2118;
  --panel: #1c2118;
  --panel-2: #272d21;
  --line: #3b4230;
  --ink: #ebe4cd;
  --ink-dim: #a7a189;
  --land: #6b6853;
  --wild: #5b6146;
  --fog: #222b28;
  --ocean-deep: #2c4a52;
  --land-edge: #1d1a12;
  --signal: #e9b949;   /* player / call to action */
  --danger: #dc4a3a;
  --ok: #82b85c;
  --brass: #c9a24a;
  --paper: #e8ddbf;
  --font-display: "Black Han Sans", "Noto Sans KR", system-ui, sans-serif;
  --font-stencil: "Black Ops One", "Black Han Sans", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .25 0 0 0 0 .12 0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ocean); color: var(--ink); font-family: var(--font-body);
  overflow: hidden;
}
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* ---- command bar ---- */
.bar {
  position: relative; z-index: 2;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--grain), linear-gradient(180deg, #434a2e 0%, #333924 55%, #2a2f1e 100%);
  border-bottom: 2px solid #0e100a; box-shadow: 0 3px 10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
}
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 4px; pointer-events: none;
  background: repeating-linear-gradient(-45deg, #e3b23c 0 8px, #15170f 8px 16px); opacity: .85; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-size: 22px; letter-spacing: .03em; color: #f3ead0; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
.brand .emblem { width: 30px; height: 32px; flex: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
.brand small { display: block; font-family: var(--font-stencil); font-size: 10.5px; color: var(--brass); letter-spacing: .22em; text-transform: uppercase; line-height: 1; margin-top: 2px; text-shadow: none; }
.stat { display: flex; flex-direction: column; line-height: 1.15; padding: 3px 9px; background: rgba(10,12,6,.38); border: 1px solid rgba(0,0,0,.5);
  border-radius: 3px; box-shadow: inset 0 1px 2px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.07); }
.stat b { font-family: var(--font-data); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; color: #f6d77e; }
.stat span { font-size: 10px; color: #b8b296; letter-spacing: .08em; }
.chip { font-family: var(--font-display); font-size: 12.5px; letter-spacing: .06em; padding: 4px 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,.5); color: #cfc8ad; background: rgba(0,0,0,.25); white-space: nowrap; }
.chip.live { color: #1b1606; background: linear-gradient(#f2c95a, #d9a531); border-color: #6e4f12; box-shadow: 0 0 0 1px rgba(255,220,130,.25), 0 0 14px rgba(233,185,73,.35); }
.spacer { flex: 1; }
.controls { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
button {
  font: inherit; font-size: 13px; color: #efe8cf;
  background: linear-gradient(180deg, #535a3c 0%, #3b4129 100%);
  border: 1px solid #14170d; border-radius: 3px; padding: 7px 12px; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.5); text-shadow: 0 1px 0 rgba(0,0,0,.4);
  transition: filter .12s, transform .06s;
}
button:hover { filter: brightness(1.15); }
button:active:not([disabled]) { transform: translateY(1px); box-shadow: inset 0 1px 3px rgba(0,0,0,.45); }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
button.primary { background: linear-gradient(180deg, #f1c75a 0%, #cf9a2b 100%); color: #20170a; border-color: #6a4c10; font-weight: 700; text-shadow: 0 1px 0 rgba(255,240,200,.4); }
button[disabled] { opacity: .4; cursor: default; filter: grayscale(.4); }
.seg { display: inline-flex; border: 1px solid #14170d; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
.seg button { border: 0; border-radius: 0; padding: 7px 10px; box-shadow: none; }
.seg button + button { border-left: 1px solid rgba(0,0,0,.45); }
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, #2a2e1d, #20241a); color: var(--signal); box-shadow: inset 0 2px 4px rgba(0,0,0,.55); }
#sndBtn { padding: 7px 9px; min-width: 38px; }

/* ---- map table ---- */
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; }
.mapwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(70,84,62,.55) 0%, rgba(20,24,17,0) 62%),
    repeating-linear-gradient(0deg, transparent 0 47px, rgba(150,160,120,.06) 47px 48px),
    repeating-linear-gradient(90deg, transparent 0 47px, rgba(150,160,120,.06) 47px 48px),
    radial-gradient(ellipse at center, #232a1f 0%, #141811 65%, #0b0d09 100%);
}
.mapwrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(0,0,0,.7); }
.mapwrap.shake { animation: shake .38s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%, 90% { transform: translate(-1px, 1px); } 20%, 80% { transform: translate(3px, -2px); } 30%, 50%, 70% { transform: translate(-4px, 2px); } 40%, 60% { transform: translate(4px, -1px); } }
svg#map { width: 100%; height: 100%; display: block; touch-action: none; }
.terr { stroke: rgba(28,22,12,.55); stroke-width: .45; cursor: pointer; transition: fill .45s; }
.terr:hover { filter: brightness(1.22) saturate(1.1); }
.terr.sel { stroke: #ffe39a; stroke-width: 2.4; }
.terr.tgt-enemy { stroke: #ff5a44; stroke-width: 1.6; stroke-dasharray: 4 3; }
.terr.tgt-own { stroke: #9be06e; stroke-width: 1.4; stroke-dasharray: 4 3; }
@keyframes march { to { stroke-dashoffset: -14; } }
.globe { stroke: #0d1a1c; stroke-width: 1.5; }
.terr.fog { stroke: rgba(0,0,0,.25); cursor: default; }
.terr.fog:hover { filter: none; }
.terr.stale { opacity: .6; }
.coast-glow { fill: none; stroke: rgba(196,226,214,.22); stroke-width: 4.5; stroke-linejoin: round; pointer-events: none; }
.coast { fill: none; stroke: rgba(30,24,12,.8); stroke-width: .8; pointer-events: none; }
.cut { fill: none; stroke: rgba(28,22,12,.5); stroke-width: .5; stroke-dasharray: 2 1.5; pointer-events: none; }
.lbl .occ { font-family: var(--font-data); font-weight: 600; font-size: 8px; fill: #ffe08a; paint-order: stroke; stroke: rgba(14,12,6,.9); stroke-width: 2.4px; }
.fborder { fill: none; stroke: rgba(20,15,6,.9); stroke-width: 1.5; stroke-linejoin: round; pointer-events: none; }
.front-glow { fill: none; stroke: rgba(255,72,40,.55); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; filter: blur(2px); }
.front { fill: none; stroke: #ff6a3d; stroke-width: 1.8; stroke-dasharray: 5 3; stroke-linecap: round; pointer-events: none; }
.shade, .grainlay { pointer-events: none; }
.grainlay { mix-blend-mode: multiply; opacity: .55; }
svg.moving .grainlay, svg.moving .front-glow, svg.moving .coast-glow, svg.moving .lbl .l2, svg.moving .lbl .l3 { display: none; }
svg.moving .terr { transition: none; }
.sea { fill: none; stroke: #b9dbe0; stroke-width: .7; stroke-dasharray: 1.5 3.5; stroke-linecap: round; opacity: .5; pointer-events: none; }
.sea.hot { stroke: var(--signal); opacity: 1; stroke-width: 1.2; }
.reach { pointer-events: none; }
.reach.atk { fill: rgba(255,70,40,.3); }
.reach.mv { fill: rgba(140,230,100,.26); }
.reach.no { fill: rgba(160,160,160,.18); }
.route { fill: none; stroke-linecap: round; pointer-events: none; }
.route.atk { stroke: #ff5a44; stroke-width: 2.2; marker-end: url(#arAtk); }
.route.mv { stroke: #9be06e; stroke-width: 2; marker-end: url(#arMv); }
.route.no { stroke: #9a9a8a; stroke-width: 1.3; stroke-dasharray: 3 3; opacity: .7; }
.route.sea { stroke-dasharray: 5 3; }
.route.idle { opacity: .45; }
.rtag { font-family: var(--font-body); font-weight: 700; font-size: 9px; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: rgba(14,12,6,.9); stroke-width: 2.6px; pointer-events: none; }
.rtag.atk { fill: #ff8a70; } .rtag.mv { fill: #b9f08e; } .rtag.no { fill: #c9c9b8; }
.lbl { pointer-events: none; }
.lbl text { font-family: var(--font-data); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.lbl .nm { font-family: var(--font-display); font-weight: 400; fill: #f6eed6; paint-order: stroke; stroke: rgba(14,12,6,.88); stroke-width: 2.6px; letter-spacing: .03em; }
.lbl .nm.mine { fill: #ffe08a; }
.lbl .l2, .lbl .l3 { font-family: var(--font-body); fill: #f1ead2; paint-order: stroke; stroke: rgba(14,12,6,.85); stroke-width: 2.4px; font-weight: 500; }
.lbl .l3 { fill: #ffd76e; }
.tok rect { stroke: #12100a; stroke-width: 1; }
.lbl.neu .tok, .lbl.neu .cnt { opacity: .78; }
.tok .c { filter: drop-shadow(0 1.5px 1px rgba(0,0,0,.6)); }
.tok .sym { fill: none; stroke: #12100a; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
.tok .q { font-size: 9px; fill: #d8d2bb; }
.tok .cap { fill: #ffd34d; stroke: #3a2a00; stroke-width: .7; }
.tok.mine .c { stroke: #fff3c0; stroke-width: 1.4; }
.tok.ready .c { stroke: #ffe08a; stroke-width: 2.2; }   /* still: a looping glow on dozens of counters kept the whole map repainting */
.cnt rect { fill: #14120b; stroke: rgba(240,230,200,.55); stroke-width: .6; }
.cnt text { font-size: 7.6px; fill: #f3ead0; }
.cnt.mine text { fill: #ffd76e; }
.lbl .pole { stroke: #2a2214; stroke-width: 1.2; }
.fx text { font-family: var(--font-display); text-anchor: middle; paint-order: stroke; stroke: rgba(10,8,4,.9); stroke-width: 3px; pointer-events: none; }
.fx { pointer-events: none; }

.tip {
  position: absolute; pointer-events: none;
  padding: 8px 10px; border-radius: 2px; font-size: 12px; min-width: 150px; max-width: 240px; z-index: 5;
}
.tip h4 { margin: 0 0 4px; font-size: 13px; font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-dim); align-items: center; }
.tip .row b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }
.tip .odds { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
/* the small card beside the selected region (placePop keeps it inside the map) */
.pop { position: absolute; z-index: 5; width: 196px; padding: 7px 9px 9px; border-radius: 2px; font-size: 12px; }
.pop h4 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pop .x { padding: 0 6px; font-size: 15px; line-height: 1.3; }
.pop .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink-dim); }
.pop .row span { display: flex; align-items: center; min-width: 0; }
.pop .row b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }
.pop .popb { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
.pop .popb button, .pop > button { font-size: 11.5px; padding: 4px 6px; }
.pop > button { width: 100%; margin-top: 6px; }
.pop .hint { font-size: 11.5px; margin-top: 4px; }

.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; font-size: 11px; color: #cfc8ae; z-index: 3;
  background: rgba(18,21,14,.82); padding: 6px 10px; border-radius: 3px; border: 1px solid #3b4230; line-height: 1.5;
  display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: center; max-width: calc(100% - 110px); box-shadow: 0 4px 12px rgba(0,0,0,.45); }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend svg { flex: none; }
.legend .lg-tip { color: #9f9a82; }

/* ---- dispatch column ---- */
.side { min-height: 0; overflow-y: auto; border-left: 2px solid #0e100a;
  background: var(--grain), linear-gradient(180deg, #252b1f, #1a1e15);
  padding-block: 14px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.side h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 13px; letter-spacing: .16em; color: var(--brass); display: flex; align-items: center; gap: 8px; }
.side h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,162,74,.6), transparent); }

/* paper (dossier) surfaces: ink tokens flip to dark-on-paper */
.card, .overlay .box, .pop, .tip, .toast {
  --ink: #2c2618; --ink-dim: #6c6045; --line: #bfae84; --panel: #e8ddbf; --panel-2: #e0d3ae;
  --signal: #8f5c06; --danger: #a52f1e; --ok: #3e7230; --ocean: #f4edd8; --land: #8d876c;
  color: var(--ink);
  background: var(--grain), linear-gradient(170deg, #f1e8cc 0%, #e6dab8 60%, #d9caa1 100%);
  border: 1px solid #b6a376; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 6px 18px rgba(0,0,0,.5);
}
.card button:not(.primary), .overlay .box button:not(.primary), .pop button:not(.primary) {
  color: #2c2618; background: linear-gradient(180deg, #f5eed8, #ddd0aa); border-color: #9c8a5d; text-shadow: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 1px rgba(60,45,15,.35);
}
.overlay .box .seg button[aria-pressed="true"] { background: linear-gradient(180deg, #3b4129, #2b301f); color: #f6d77e; }
.card { border-radius: 2px; padding: 14px 12px 12px; position: relative; }
.card::before { content: ""; position: absolute; top: -7px; left: 14px; width: 62px; height: 8px; background: #d9caa1; border: 1px solid #b6a376; border-bottom: 0; border-radius: 3px 3px 0 0; }
.card .name { font-family: var(--font-display); font-size: 21px; text-wrap: balance; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 2px double #b6a376; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin-top: 8px; font-size: 12.5px; }
.kv span { color: var(--ink-dim); }
.kv b { font-family: var(--font-data); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; display: inline-flex; align-items: center; justify-content: flex-end; gap: 5px; }
.hint { font-size: 12.5px; color: var(--ink-dim); line-height: 1.55; margin-top: 8px; }
.hint strong { color: var(--signal); font-weight: 700; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.flag { display: inline-block; vertical-align: -3px; flex: none; border: 1px solid rgba(0,0,0,.55); box-shadow: 0 1px 2px rgba(0,0,0,.35); border-radius: 1px; margin-right: 6px; }
.kv b .flag { margin-right: 0; }
.rank { display: flex; flex-direction: column; gap: 7px; }
.rank .r { display: grid; grid-template-columns: 1fr 52px; gap: 4px 8px; align-items: center; font-size: 12.5px; }
.rank .r > span:first-child { display: flex; align-items: center; min-width: 0; }
.rank .r.dead { opacity: .35; text-decoration: line-through; }
.rank .bar2 { grid-column: 1 / -1; height: 6px; background: rgba(0,0,0,.45); border-radius: 1px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
.rank .bar2 div { height: 100%; background-image: repeating-linear-gradient(90deg, transparent 0 5px, rgba(0,0,0,.28) 5px 6px) !important; background-blend-mode: normal; }
.rank .pct { font-family: var(--font-data); text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 8px 10px; font-family: var(--font-data); font-size: 11.5px; line-height: 1.5; display: flex; flex-direction: column; gap: 4px;
  background: #0d100b; border: 1px solid #000; border-radius: 3px; box-shadow: inset 0 0 18px rgba(0,0,0,.8); max-height: 340px; overflow-y: auto;
  background-image: repeating-linear-gradient(0deg, rgba(130,190,110,.035) 0 1px, transparent 1px 3px); }
.log li { color: #93a989; border-left: 2px solid #2d3a29; padding-left: 8px; font-family: var(--font-body); }
.log li.me { border-left-color: var(--signal); color: #f1d98e; }
.log li.bad { border-left-color: var(--danger); color: #f0a294; }
.log li .t { font-family: var(--font-data); font-size: 10.5px; color: #5f7a57; margin-right: 6px; }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(10,12,8,.62), rgba(4,5,3,.86)); z-index: 10; padding: 16px; }
.overlay .box { position: relative; max-height: 100%; overflow-y: auto; max-width: 540px; border-radius: 2px; padding: 26px 24px 22px; text-align: left; animation: dropin .35s ease-out; }
.overlay .box::before { content: "작전 명령서"; position: absolute; top: 14px; right: 16px; font-family: var(--font-display); font-size: 13px; letter-spacing: .14em; color: rgba(168,40,28,.78);
  border: 2px solid rgba(168,40,28,.7); padding: 2px 8px; transform: rotate(6deg); border-radius: 3px; pointer-events: none; }
@keyframes dropin { from { transform: translateY(-14px) rotate(-.6deg); opacity: 0; } }
.overlay h2 { font-family: var(--font-display); font-weight: 400; font-size: 31px; margin: 0 0 8px; padding-right: 110px; color: #231e12; }
.overlay p { color: var(--ink-dim); line-height: 1.6; margin: 0 0 14px; font-size: 13.5px; }
.overlay p b { color: #7a1f12 !important; }
.resbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.resbar .rs { background: linear-gradient(180deg, #2f3626, #22271b); border: 1px solid #0f120b; border-radius: 3px; padding: 6px 8px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.4); }
.resbar .rs svg { grid-row: 1 / 3; width: 22px; height: 22px; }
.resbar span { font-size: 10.5px; color: var(--ink-dim); grid-column: 2 / -1; }
.resbar b { font-family: var(--font-data); font-size: 16px; font-variant-numeric: tabular-nums; color: #f3e6bd; }
.resbar i { font-style: normal; font-family: var(--font-data); font-size: 11px; color: var(--ok); }
.resbar i.neg { color: var(--danger); }
.tabs { display: flex; gap: 3px; border-bottom: 2px solid #b6a376; flex-wrap: wrap; padding-left: 4px; }
.tabs button { border: 1px solid #0f120b; border-bottom: 0; border-radius: 4px 4px 0 0; padding: 6px 10px; color: #bdb69b; font-size: 12.5px; background: linear-gradient(180deg, #3a412b, #2a3020); box-shadow: none; }
.tabs button[aria-selected="true"] { color: #2c2618; background: linear-gradient(180deg, #f1e8cc, #e1d5b0); border-color: #b6a376; font-weight: 700; text-shadow: none; }
.sub { margin: 14px 0 6px; font-size: 11.5px; letter-spacing: .12em; color: #7a1f12; font-family: var(--font-display); font-weight: 400; }
.blds { display: flex; flex-direction: column; gap: 6px; }
.bld { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.bld span { font-size: 12.5px; min-width: 0; }
.bld i { font-style: normal; font-family: var(--font-data); color: var(--ink-dim); font-size: 11px; }
.bld small { display: block; color: var(--ink-dim); font-size: 11px; }
.bld button, .btnrow button, .dip button { font-size: 11.5px; padding: 5px 8px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.dips { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

.joinrow input, .nickrow input { flex: 1; min-width: 0; font: inherit; font-family: var(--font-data); color: var(--ink); background: var(--ocean); border: 1px solid var(--line); border-radius: 2px; padding: 7px 10px; }
.nickrow { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-dim); }
.code { font-family: var(--font-data); font-size: 22px; letter-spacing: .12em; color: var(--signal); }

.lobbybtns { display: flex; gap: 8px; margin-top: 14px; }
.modeseg button { flex: 1; padding: 9px 10px; }

function income(fid) {
  let v = 0, n = 0;
  for (let i = 0; i < N; i++) if (S.owners[i] === fid) { v += T[i].value; n++; }
  const home = S.owners[fac(fid).home] === fid ? 2 : 0;
  return Math.round((4 + 2.2 * Math.sqrt(v + n)) * (eraDef() ? eraDef().inc : 1)) + home;
}

  if (!e) return `${2031 + Math.floor((t - 1) / 4)}년 ${SEASONS[(t - 1) % 4]}`;

};

function endTurn() {

    if (S.mode === "rt" || travelDays(s, i) > 1) html += `<div class="row"><span>도착까지</span><b>${travelDays(s, i)}${dUnit()}</b></div>`;
    html += `<div class="odds row"><span>${S.mode === "rt" ? "지금 기준 승률" : "예상 승률"}</span><b style="color:${p > .6 ? "var(--ok)" : p < .4 ? "var(--danger)" : "var(--signal)"}">${Math.round(p * 100)}%</b></div>`;

function posTip(e) {

}

let toastT = 0;

const setPct = p => { ui.pct = p; if (S) render(); };

document.addEventListener("keydown", e => {

// ---------- network (room capability) ----------
// The host's page runs the whole simulation; guests send orders and draw the host's state.
const NET = { room: null, role: null, code: "", sc: null, seats: {}, focus: {}, peers: [], myPeer: null, hostPeer: null, endShown: false };
let roomApi = null;
(window.claude && window.claude.use ? window.claude.use("room") : Promise.resolve(null)).then(r => {
  roomApi = r;
  if (S && S.phase === "scenario" && !document.getElementById("overlay").hidden) showScenarios();
}).catch(() => {});
function nick() {
  let n = ""; try { n = localStorage.getItem("iron-frontier-nick") || ""; } catch (_) {}
  return n || `지휘관${Math.floor(10 + Math.random() * 90)}`;
}
async function enterRoom(code, role, sc) {
  NET.role = role; NET.code = code; NET.sc = sc || null; NET.seats = {}; NET.focus = {}; NET.endShown = false; NET.nick = nick();
  let room;
  try { room = await roomApi.join("wf-" + code); } catch (e) { toast("방에 들어갈 수 없습니다. 코드를 확인하세요.", "lose"); return; }
  NET.room = room;
  room.onPeers(ch => { NET.peers = ch.peers; onPeersChange(ch); });
  room.on("state", m => { if (NET.role === "guest" && !m.sameTab && (!NET.hostPeer || m.peer === NET.hostPeer)) applyState(m.data); });
  room.on("act", m => { if (NET.role === "host" && !m.sameTab) hostAct(m); });
  room.on("econ", m => { if (NET.role === "guest" && !m.sameTab && (!NET.hostPeer || m.peer === NET.hostPeer)) applyEcon(m.data); });
  room.presence({ nick: NET.nick, want: null, role, sc: NET.sc, seats: {}, phase: "lobby" }).catch(() => {});
  S.phase = "lobby"; S.net = null; S.mode = "rt";
  showLobby(); render();
}
function netLeave() {
  if (NET.room) NET.room.leave().catch(() => {});
  NET.room = null; NET.role = null; NET.hostPeer = null;
}
function onPeersChange(ch) {
  const me = NET.peers.find(p => p.sameTab); if (me) NET.myPeer = me.peer;
  if (NET.role === "host") {
    if (S.phase === "lobby") {
      const present = new Set(NET.peers.map(p => p.peer)), seats = {};
      for (const [peer, k] of Object.entries(NET.seats)) if (present.has(peer)) seats[peer] = k;
      const n = factionsFor(NET.sc).length;
      for (const p of NET.peers) {
        const w = p.presence && p.presence.want;
        if (w === null || w === undefined) { delete seats[p.peer]; continue; }
        if (!Number.isInteger(w) || w < 0 || w >= n) continue;
        if (!Object.entries(seats).some(([q, k]) => k === w && q !== p.peer)) seats[p.peer] = w;
      }
      if (JSON.stringify(seats) !== JSON.stringify(NET.seats)) { NET.seats = seats; NET.room.presence({ seats }).catch(() => {}); }
      showLobby();
    }
  } else {
    const host = NET.peers.find(p => p.presence && p.presence.role === "host");
    if (host) { NET.hostPeer = host.peer; NET.sc = host.presence.sc; NET.seats = host.presence.seats || {}; }
    if (S.phase === "lobby") showLobby();
    else if (S.net === "guest" && ch.left.some(p => p.peer === NET.hostPeer) && S.phase !== "over") {
      S.phase = "over"; render();
      const box = document.getElementById("overlayBox");
      box.innerHTML = `<h2>연결 종료</h2><p>방장이 나가서 게임이 끝났습니다.</p><button type="button" class="primary" id="againBtn">처음으로</button>`;
      document.getElementById("overlay").hidden = false; document.getElementById("againBtn").onclick = newGame;
    }
  }
}
function showLobby() {
  const box = document.getElementById("overlayBox");
  if (!box.querySelector("#lobbyDyn")) {
    box.innerHTML = `<h2>네트워크 대전</h2>
      <p>방 코드 <b class="code">${NET.code}</b><br>함께할 사람에게 이 코드를 알려 주세요. 이 페이지를 공유받은 사람만 들어올 수 있습니다.</p>
      <label class="nickrow">내 이름 <input id="netNick" maxlength="12" autocomplete="off"></label>
      <div id="lobbyDyn"></div>
      <div class="lobbybtns"><button type="button" id="netStartBtn" class="primary" hidden>전쟁 시작</button><button type="button" id="netLeaveBtn">나가기</button></div>`;
    const ni = document.getElementById("netNick"); ni.value = NET.nick;
    ni.oninput = () => { NET.nick = ni.value.trim().slice(0, 12) || "지휘관"; try { localStorage.setItem("iron-frontier-nick", NET.nick); } catch (_) {} NET.room?.presence({ nick: NET.nick }).catch(() => {}); };
    document.getElementById("netLeaveBtn").onclick = newGame;
    document.getElementById("netStartBtn").onclick = netStart;
    document.getElementById("overlay").hidden = false;
  }
  const dyn = document.getElementById("lobbyDyn");
  if (!NET.sc) { dyn.innerHTML = `<p>방장을 찾는 중입니다. 코드가 맞는지 확인하세요.</p>`; return; }
  const sc = [...ERAS, ...SCENARIOS].find(x => x.id === NET.sc);
  const byPeer = new Map(NET.peers.map(p => [p.peer, p]));
  const seatOf = k => Object.entries(NET.seats).find(([, v]) => v === k);
  const name = p => esc(String((p && p.presence && p.presence.nick) || "참가자").slice(0, 12));
  dyn.innerHTML = `<h3 class="scenh">시나리오 · ${sc ? sc.name : ""}</h3>
    <div class="scen">${factionsFor(NET.sc).map((f, k) => {
      const seat = seatOf(k), mine = seat && seat[0] === NET.myPeer;
      return `<button type="button" class="scenbtn seat${mine ? " mine" : ""}" data-k="${k}"><b>${flagHTML(f, 26)}${f.name}</b><em>${seat ? (mine ? "나" : name(byPeer.get(seat[0]))) : "컴퓨터"}</em></button>`;
    }).join("")}</div>
    <h3 class="scenh">접속 중 ${NET.peers.length}명</h3>
    <p>${NET.peers.map(p => `${name(p)}${p.presence && p.presence.role === "host" ? " (방장)" : ""}${p.sameTab ? " · 나" : ""}`).join(", ")}</p>
    <p>${NET.role === "host" ? "세력을 하나 고른 뒤 전쟁 시작을 누르세요. 비어 있는 세력은 컴퓨터가 맡습니다." : "세력을 고르고 방장이 시작하기를 기다리세요."}</p>`;
  dyn.querySelectorAll(".seat").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, mine = NET.seats[NET.myPeer] === k;
    NET.room?.presence({ want: mine ? null : k }).catch(() => {});
  });
  const sb = document.getElementById("netStartBtn");
  sb.hidden = NET.role !== "host";
  sb.disabled = NET.seats[NET.myPeer] === undefined;
}
const esc = t => t.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function netStart() {
  setupScenario(NET.sc);
  S.mode = "rt"; S.net = "host"; S.speed = "day"; S.paused = false; S.over = null;
  const humans = new Set(Object.values(NET.seats));
  S.player = NET.seats[NET.myPeer];
  S.factions.forEach(f => { f.isPlayer = f.id === S.player; f.human = humans.has(f.id); });
  begin();
  addLog(`네트워크 대전 시작 · 사람 ${humans.size}명, 컴퓨터 ${S.factions.length - humans.size}세력`, "me");
  hideOverlay(); ui.sel = -1;
  NET.room.presence({ phase: "game" }).catch(() => {});
  render(); broadcast(true);
}
let bcastT = 0;
function broadcast(now) {
  if (S.net !== "host" || !NET.room) return;
  const send = () => { bcastT = 0; if (!NET.room) return; NET.room.emit("state", packState()).catch(() => {}); NET.room.emit("econ", packEcon()).catch(() => {}); };
  if (now) { clearTimeout(bcastT); send(); } else if (!bcastT) bcastT = setTimeout(send, 120);
}
function packState() {
  return { sc: S.scenario, t: S.turn, o: S.owners, r: S.troops, a: S.acted.map(x => x ? 1 : 0).join(""),
    al: S.factions.map(f => f.alive ? 1 : 0).join(""), seats: NET.seats, p: S.paused ? 1 : 0, sp: S.speed,
    ov: S.over ? S.over.w : -1, lg: S.log.slice(-4).map(l => ({ i: l.i, t: l.t, m: l.m })),
    mr: marches().map(m => [m.id, m.f, m.s, m.t, m.n, m.d0, m.d1, m.k === "mv" ? 1 : 0]),
    oc: Object.entries(S.occ || {}).map(([k, o]) => [+k, o.f, o.p, o.t]) };
}
function packEcon() {
  return { b: S.bld.map(x => x.join("")).join(""), rs: S.res.map(x => [x.f, x.m, x.g]), pc: S.peace, tr: S.trade, rp: S.rep, wp: S.wpn, tc: S.tech, of: S.offers.slice(-12) };
}
function applyEcon(d) {
  if (S.net !== "guest" || !d || typeof d.b !== "string" || d.b.length !== N * 4 || !Array.isArray(d.rs) || d.rs.length !== S.factions.length) return;
  S.bld = T.map((_, i) => [0, 1, 2, 3].map(k => Math.min(3, +d.b[i * 4 + k] || 0)));
  S.res = d.rs.map(x => ({ f: x[0] | 0, m: x[1] | 0, g: x[2] | 0 }));
  const okKeys = o => Object.fromEntries(Object.entries(o && typeof o === "object" ? o : {}).filter(([k]) => /^\d+-\d+$/.test(k)));
  S.peace = okKeys(d.pc); S.trade = okKeys(d.tr);
  S.rep = Array.isArray(d.rp) ? d.rp.map(x => Math.max(0, Math.min(100, x | 0))) : S.rep;
  S.wpn = Array.isArray(d.wp) && d.wp.length === S.factions.length ? d.wp.map(x => Math.max(0, Math.min(3, x | 0))) : S.wpn;
  S.tech = Array.isArray(d.tc) && d.tc.length === S.factions.length ? d.tc.map(x => Math.max(0, Math.min(3, x | 0))) : S.tech;
  S.offers = (Array.isArray(d.of) ? d.of : []).filter(o => o && Number.isInteger(o.id) && fac(o.from) && fac(o.to) && ["peace", "trade", "merge", "surr"].includes(o.type));
  render();
}
function applyState(d) {
  if (!d || !Array.isArray(d.o) || d.o.length !== N || !Array.isArray(d.r) || d.r.length !== N) return;
  if (S.net !== "guest" || S.scenario !== d.sc) {
    setupScenario(d.sc); initEcon(); S.net = "guest"; S.mode = "rt"; S.log = []; S.logN = 0; NET.endShown = false; ui.marchSync = false;
    hideOverlay(); addLog("방장의 전쟁에 합류했습니다.", "me");
    setTimeout(() => { if (S.player >= 0) turnTo(fac(S.player).home); }, 0);
  }
  S.owners = d.o.map(x => Number.isInteger(x) && x >= -1 && x < S.factions.length ? x : -1);
  S.troops = d.r.map(x => Math.max(0, Math.min(99999, x | 0)));
  S.acted = Array.from({ length: N }, (_, i) => d.a && d.a[i] === "1");
  if ((d.t | 0) !== S.turn) ui.tickAt = performance.now();
  S.turn = d.t | 0; S.paused = !!d.p; S.speed = d.sp;
  NET.seats = d.seats && typeof d.seats === "object" ? d.seats : {};
  const humans = new Set(Object.values(NET.seats));
  const mine = NET.seats[NET.myPeer];
  S.player = Number.isInteger(mine) ? mine : -1;
  S.factions.forEach((f, k) => { f.alive = !d.al || d.al[k] !== "0"; f.isPlayer = k === S.player; f.human = humans.has(k); });
  const okI = (x, hi) => Number.isInteger(x) && x >= 0 && x < hi;
  const had = new Set(marches().map(m => m.id));
  S.march = (Array.isArray(d.mr) ? d.mr : []).filter(a => Array.isArray(a) && Number.isInteger(a[0]) && okI(a[1], S.factions.length) && okI(a[2], N) && okI(a[3], N))
    .map(a => ({ id: a[0], f: a[1], s: a[2], t: a[3], n: Math.max(1, Math.min(99999, a[4] | 0)), d0: a[5] | 0, d1: a[6] | 0, k: a[7] ? "mv" : "atk" }));
  S.occ = {};
  for (const a of Array.isArray(d.oc) ? d.oc : []) if (Array.isArray(a) && okI(a[0], N) && okI(a[1], S.factions.length)) S.occ[a[0]] = { f: a[1], p: Math.max(1, Math.min(T[a[0]].hold, a[2] | 0)), t: a[3] | 0 };
  if (ui.marchSync) for (const m of S.march) if (!had.has(m.id)) warnMarch(m);
  ui.marchSync = true;
  const seen = new Set(S.log.map(l => l.i));
  for (const l of (Array.isArray(d.lg) ? d.lg : [])) if (Number.isInteger(l.i) && !seen.has(-l.i)) { if (!S.log.some(x => x.i === -l.i)) S.log.push({ i: -l.i, t: l.t | 0, m: esc(String(l.m).slice(0, 200)), k: "" }); }
  if (S.log.length > 120) S.log.splice(0, S.log.length - 120);
  if (d.ov >= 0) { S.over = { w: d.ov }; S.phase = "over"; showNetEnd(); } else S.phase = "ops";
  if (ui.sel >= N) ui.sel = -1;

}
function hostAct(m) {
  const fid = NET.seats[m.peer], d = m.data || {};
  if (!Number.isInteger(fid) || S.phase !== "ops" || S.paused) return;
  if (["build", "rec", "mkt", "dip", "ans", "wpn", "exp", "auto"].includes(d.k)) {
    doAction(fid, { k: d.k, s: d.s, b: d.b, n: d.n, op: d.op, to: d.to, id: d.id, yes: !!d.yes, at: NET.focus[fid] });
    render(); broadcast(); return;
  }
  const s = d.s, t = d.t;
  if (!Number.isInteger(s) || s < 0 || s >= N || owner(s) !== fid) return;
  if (d.k === "focus") { NET.focus[fid] = s; return; }
  if (!Number.isInteger(t) || t < 0 || t >= N || !NB(s).has(t) || !canLaunch(s)) return;
  const pct = [0.25, 0.5, 0.75, 1].includes(d.p) ? d.p : 1;
  if (d.k === "mv" && owner(t) === fid) { addLog(`${fac(fid).name}: ${tn(s)} → ${tn(t)} 병력 ${move(s, t, pct)} 이동`); }
  else if (d.k === "atk" && owner(t) !== fid && canAttack(s, t)) { attack(s, t, pct); checkEnd(); }
  else return;
  render(); broadcast();
}
function showNetEnd() {
  if (NET.endShown || !S.over) return;
  NET.endShown = true;
  const w = fac(S.over.w), win = S.over.w === S.player;
  const box = document.getElementById("overlayBox");
  box.innerHTML = `<h2>${win ? "승전" : "전쟁 종결"}</h2><p>${w.name}${w.human ? "" : " (컴퓨터)"} 세력이 세계를 제패했습니다.<br>${dateLabel(S.turn)}, 개전 ${S.turn}일째.</p><button type="button" class="primary" id="againBtn">처음으로</button>`;
  document.getElementById("overlay").hidden = false;
  document.getElementById("againBtn").onclick = newGame;
}

// ---------- persistence ----------
const KEY = "iron-frontier-v1";
function persist() { if (S && S.net) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} }
function restore(data) {
  let saved = data && data.S;
  if (!saved) { try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) { saved = null; } }
  if (saved && (saved.net || saved.v !== 4)) saved = null;
  if (saved && saved.owners && saved.owners.length === N) { S = saved; render(); if (S.phase === "scenario") showScenarios(); startClock(); if (S.over) showEnd(S.over === "win", "지난 전쟁은 이미 끝났습니다."); }
  else newGame();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
const boot = data => restore(data);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
